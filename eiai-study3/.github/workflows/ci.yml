name: ci

# Gate as of day 4:
#   typecheck (libraries + app) -> unit, property, model-based, durability and
#   golden-file tests -> data-dictionary drift -> content equivalence ->
#   manifest integrity
#
# Later days add e2e, the simulation-bot parameter-recovery run, and the
# `make paper` repro gate (STUDY3_SPEC_v3.md section 2).

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: eiai-study3

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: eiai-study3/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit, property, model-based, durability and golden-file tests
        # Includes the stimulus golden-file test (every frozen response file is
        # re-hashed against the committed manifest, so one changed byte fails
        # the build), the model-based UI suite driving generated statechart
        # paths against the real DOM, and the offline-durability suite that
        # asserts zero event loss across a network outage plus a reload.
        run: pnpm test

      - name: Data dictionary is not stale
        # The dictionary ships in the paper's appendix. If the schemas moved and
        # the dictionary did not, the appendix would misdescribe the collected
        # data -- so this is a build failure, not a warning.
        run: pnpm codegen:check

      - name: Content equivalence across conditions
        # Answers the reviewer objection directly: identical numeric claims and
        # byte-identical justifications in warm and neutral.
        run: python pipeline/verify_equivalence.py

      - name: Stimulus manifest integrity
        run: python pipeline/hash_manifest.py --check
